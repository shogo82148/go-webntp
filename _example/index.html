<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071011"><title>Digital Clock | WebNTP</title>
  <style>
    :root{color-scheme:dark;--ink:#e8fff5;--muted:#82a198;--accent:#74f9c5;--line:rgba(116,249,197,.17)}
    *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 50% 32%,rgba(28,103,80,.22),transparent 36rem),linear-gradient(145deg,#091313,#030707 70%);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:100% 4px}
    main{width:min(92vw,960px);padding:clamp(2rem,6vw,5rem);border:1px solid var(--line);border-radius:2px;background:rgba(8,26,25,.78);box-shadow:0 30px 100px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(18px)}
    .eyebrow,.status{display:flex;align-items:center;gap:.65rem;margin:0;color:var(--muted);font-size:.72rem;font-weight:650;letter-spacing:.2em;text-transform:uppercase}.eyebrow:before{content:"";width:2rem;height:1px;background:var(--accent)}
    .clock{display:flex;align-items:baseline;margin:clamp(1.6rem,5vw,3.5rem) 0 1.3rem;font-family:"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums;line-height:.88;letter-spacing:-.075em;text-shadow:0 0 28px rgba(116,249,197,.14)}
    #time{font-size:clamp(3.15rem,12.5vw,9rem)}#milliseconds{min-width:3ch;margin-left:.28em;color:var(--accent);font-size:clamp(1.4rem,4.4vw,3.1rem);letter-spacing:-.04em}
    .footer{display:flex;justify-content:space-between;align-items:end;gap:2rem;padding-top:1.25rem;border-top:1px solid var(--line)}#date{margin:0;font-size:clamp(.85rem,2vw,1rem);letter-spacing:.08em}.dot{width:.45rem;height:.45rem;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.38}}@media(max-width:620px){main{padding:2rem 1.4rem}.clock{margin-block:2.4rem 1.7rem}.footer{align-items:flex-start;flex-direction:column;gap:.9rem}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
</head>
<body>
  <main aria-label="デジタル時計">
    <p class="eyebrow">Japan Standard Time</p>
    <div class="clock"><time id="time" datetime="">00:00:00</time><span id="milliseconds" aria-label="ミリ秒">000</span></div>
    <div class="footer"><p id="date">時刻を取得しています</p><p class="status"><span class="dot"></span><span id="status">接続中</span></p></div>
  </main>
  <script src="./webntp.js"></script><script src="./index.js"></script>
</body>
</html>
